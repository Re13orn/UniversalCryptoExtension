# Logging configuration for Universal Crypto Extension tests

# Global logging level
.level=INFO

# Console handler configuration
handlers=java.util.logging.ConsoleHandler

# Console handler settings
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Formatter pattern
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS.%1$tL %4$s %2$s - %5$s%6$s%n

# Package-specific logging levels
com.universal.crypto.level=FINE

# Specific class logging levels
com.universal.crypto.engine.RuleMatchEngine.level=FINE
com.universal.crypto.processor.level=FINE
com.universal.crypto.handler.level=FINE
com.universal.crypto.burp.level=INFO