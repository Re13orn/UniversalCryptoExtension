playground.help.field=Field testing:\n1. Paste a JSON body.\n2. JSON paths use syntax such as $.data.id.\n3. replace/add/remove output the complete resulting JSON.
playground.help.signature=Signature testing:\n1. Paste a raw Burp HTTP request to parse method/path/query/headers/body.\n2. Custom templates support ${method}, ${path}, ${query}, ${body}, ${header.Name} and ${stablejson:payload}.\n3. Output shows the string to sign, template variables, signature and final request.
playground.help.crypto=Crypto testing:\n1. Input can be a raw body or a complete HTTP request; processing uses the parsed body and request context.\n2. Local computation runs inside the extension; External service calls your configured API.\n3. Base64/Hex/URL/digest algorithms generally require no key.
playground.help.hint.signature_header=The generated signature is written to this header.
playground.help.hint.headers=For example: {"Timestamp":"${timestamp}"}. These headers are generated before signing.
