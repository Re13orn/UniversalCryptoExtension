sign.tips=Signature tips:\n• Match the string to sign, algorithm and output format to the protocol.\n• Signing templates and pre-sign headers are common settings; sorting and separators are under Advanced parameters.\n• Protocol helpers include legacy examples. Verify them against the current client.
