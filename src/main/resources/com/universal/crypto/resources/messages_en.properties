form.sign.topic.payload=Payload sources for GET and POST
form.sign.topic=Help topic:
form.sign.guide.keys=Compute using:\n  Local computation runs SHA-256 / HMAC / RSA inside the extension.\n  External service calls your configured signing API.\n\nKey source:\n  Fixed value: enter a secret/key, usually for HMAC.\n  Fetch from API: fetch the key before signing.\n  Use cached key: reuse a cached key.\n  No key: use when the secret is already in the signing template.\n\nHash key placement:\n  Do not concatenate: SHA256(data)\n  Prepend: SHA256(key + data)\n  Append: SHA256(data + key)\n  Both: SHA256(key + data + key)
form.sign.guide.variables=Signing template = the exact string to sign.\n\n${method}              HTTP method, e.g. GET\n${path}                URL path without query\n${query}               Original query string\n${body}                Request body\n${header.Timestamp}    Timestamp header value\n${stablejson:payload}  Stable JSON from GET query or POST/PUT/PATCH body\n${timestamp}           Current generated timestamp\n\nExamples:\n${method}${path}${body}\n${header.Timestamp}${body}\nSECRET${header.X-Request-Id}${stablejson:payload}
form.sign.guide.headers=Pre-sign headers are a JSON object of headers to generate or overwrite before signing.\nExample: {"Timestamp":"${timestamp}","X-Example-Header":"30"}\n\nOrder:\n1. Generate or overwrite pre-sign headers.\n2. Resolve the signing template, e.g. ${header.Timestamp}.\n3. Calculate the signature.\n4. Write it to the General tab target, e.g. Sign.\n\nTo replay the original Repeater timestamp, do not generate Timestamp here.
form.sign.guide.canon=Canonicalization sorts and joins parameters, typically into a=1&b=2.\nPair separator is usually &, and key/value separator is usually =.\n\n${stablejson:payload} produces stable JSON:\n- Sort keys alphabetically.\n- Convert numbers and booleans to strings.\n- Remove null, undefined, NaN and empty objects.\n- Read GET query parameters or POST/PUT/PATCH body JSON.\n\nUse stable JSON when the protocol requires {"a":"1","b":"2"}.\nUse canonicalization options when it requires a=1&b=2.
form.sign.guide.payload=${stablejson:payload} reads:\n  GET             -> URL query parameters\n  POST/PUT/PATCH  -> Request body JSON\n\nGET /api?a=1&category=20\n  -> {"a":"1","category":"20"}\nPOST body {"resourceType":11,"locations":[0]}\n  -> {"locations":["0"],"resourceType":"11"}\n\nPaste a raw Burp request into the Playground to inspect the string to sign and the resulting request.
form.sign.guide.formula=Translate the signing formula in this order:\n\n1. Algorithm:\n   SHA256(...) -> SHA-256; HMAC-SHA256(...) -> HmacSHA256.\n2. Key or template constant:\n   HMAC(key, data) -> Fixed value; enter the key separately.\n   SHA256(secret + data) -> No key; include the secret in the template.\n3. Output:\n   Uppercase hexadecimal -> hex, upper; Base64 -> base64.\n4. Generated headers:\n   Dynamic timestamp -> {"Timestamp":"${timestamp}"}.\n   Replay original traffic -> preserve the original header.\n5. Destination:\n   On the General tab choose target=header and the required name, e.g. Sign or X-Signature.
form.sign.guide.applied.hmac=Generic HMAC helper applied: HmacSHA256, static key, hex lower.\nEnter the protocol secret/key in Key value.\nOn the General tab select target=header and the required name, e.g. X-Signature.\nIf query is signed too, use ${method}\\n${path}?${query}\\n${header.Timestamp}\\n${body}.
form.sign.guide.applied.hash=Generic hash helper applied: SHA-256(template), hex upper.\nReplace SECRET with the protocol constant, or edit the entire concatenation order.\nkeySource=none adds no separate key; put every signed value in the template.\n${stablejson:payload} reads GET query parameters or POST/PUT/PATCH body JSON.
