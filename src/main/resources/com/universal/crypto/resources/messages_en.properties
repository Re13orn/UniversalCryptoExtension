# Shared script and field guidance
script.help.tips=Use built-in crypto, signature and field processors when they fit the protocol.\nScripts run in Rhino JavaScript with a 5-second limit. There is no browser DOM or Packages / Java access.\nReturn a string or byte array. null / undefined preserve the input; an empty string clears it.\nUse Bytes for binary data and Crypto for PBKDF2 / AES-GCM.
script.help.reference=Input and output:\n  content                         Current action input\n  bodyBytes                       Body bytes\n  return "new value";             Write to the configured target\n\nHTTP context:\n  request.getMethod(), getUrl(), getHost(), getPath(), getQuery()\n  request.getQueryParam("name")\n  request.getHeader("Name"), request.getHeaders()  Current direction headers\n  request.getOriginalHeader("Name"), request.getOriginalHeaders()  Original request headers in both directions\n\nShared values:\n  ctx.isRequest()\n  ctx.getSharedData("name"), ctx.setSharedData("name", value)\n\nHelpers:\n  Base64.encode/decode, Hex.encode/decode (UTF-8 text)\n  Hash.md5/sha1/sha256, Hash.hmacSha1/hmacSha256/hmacSha512\n  Hash.hmacSha256Base64, Bytes, Crypto\n\nFor a header target, return the header value. For body/field targets, return the complete new body.
script.help.runtime=Runtime: Rhino JavaScript with JSON, Date, Math, RegExp, Array and String.\nNo browser objects: window, document, DOM or fetch.\nNo Node.js: require, import, npm, fs or Buffer.\n\nBuilt-in helpers: Base64, Hex, Hash, Bytes, Crypto, request and ctx.\nThe UI cannot upload npm packages, JARs or custom script libraries.\nPackages / Java access is blocked. Use Bytes for binary data and Crypto for PBKDF2 / AES-GCM.
script.help.http=HTTP context examples:\n  var method = request.getMethod();\n  var url = request.getUrl();\n  var host = request.getHost();\n  var path = request.getPath();\n  var query = request.getQuery();\n  var a = request.getQueryParam('a');\n  var ts = request.getHeader('Timestamp');\n  var original = request.getOriginalHeader('X-Nonce');\n\ncontent is the current action input. For response AAD/nonce, use getOriginalHeader rather than getHeader.
script.help.json=JSON body example:\n  var obj = JSON.parse(content || '{}');\n  obj.userId = '10001';\n  obj.debug = false;\n  return JSON.stringify(obj);\n\nFor a JSON field, parse and modify the body in the script, then return the complete body. targetType=field does not extract a field for scripts.\nFor text, transform content directly, e.g. return Base64.decode(content);
script.help.write=The General tab controls the write target. Playground displays the returned value.\n\nbody: return the complete new body.\nheader: set a target name such as X-Signature; return the signature value.\nfield: scripts must parse/modify JSON and return the complete new body.\nvariable: return a value for later actions to read with inputSource=variable.\n\nnull / undefined leave the input unchanged. An empty string clears it.
script.help.signature=Example: Sign = SHA256(method + path + query + Timestamp + body)\n\nUse action=sign, processor=script, inputSource=request-body, target=header, name=Sign. Select the intended send phase.\n\nvar raw = request.getMethod()\n        + request.getPath()\n        + request.getQuery()\n        + request.getHeader('Timestamp')\n        + content;\nreturn Hash.sha256(raw).toUpperCase();
script.help.chain=Action 1: read a token from the body for later actions.\n  var obj = JSON.parse(content || '{}');\n  ctx.setSharedData('token', obj.token || '');\n  return content;\n\nAction 2: use the token in a signature.\n  var token = String(ctx.getSharedData('token') || '');\n  return Hash.sha256(token + content);\n\nA variable target can also pass a value to a later action.
script.help.errors=Common errors:\n1. Return semantics: return a string or byte array. null / undefined preserve input; an empty string clears it.\n2. Wrong target: for a header, select header and enter its name. Return only its value.\n3. Query versus body: use request.getQuery()/getQueryParam(name) for query and content for current input.\n4. JSON.parse: check that content is JSON first.\n5. No npm/require/fetch or Packages / Java access.\n6. Long loops: scripts time out after 5 seconds.
script.help.first=Runtime: Rhino JavaScript; no window, document, fetch, require or npm.\n\n1. Read: content for current input; request.getHeader for current direction headers; request.getOriginalHeader for original request headers; getQueryParam for query.\n2. Transform: JSON.parse/stringify, Base64, Hex, Hash, HMAC, Bytes and Crypto.\n3. Write: return the final value. The General tab controls the destination. For body/field scripts, return the complete body; for a header return its value.
