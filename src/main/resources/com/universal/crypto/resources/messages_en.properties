form.sign.guide.protocol=On the General tab, use action=sign, target=header and the required signature header name.\nChoose No key if the secret is already included in the template.\n${stablejson:payload} reads GET query parameters and POST/PUT/PATCH body JSON.\nTo replay the original Timestamp in Repeater, do not regenerate that header.
