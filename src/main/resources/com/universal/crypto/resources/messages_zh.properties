form.sign.topic=查看说明:
form.sign.guide.keys=在哪里计算：\n  本地计算 = 插件本地计算签名，适合 SHA-256 / HMAC / RSA。\n  调用外部服务 = 调你的 API 服务计算签名，只有配置了签名服务时才用。\n\n密钥从哪里来：\n  固定值 = 在密钥值里填 secret/key，常见于 HMAC。\n  从接口查询 = 先请求接口拿 key，再签名。\n  使用缓存 = 使用已缓存的 key。\n  不需要密钥 = 不额外传 key。secret 已经写进签名原文时选这个。\n\n密钥如何参与哈希：\n  不拼接密钥 = 只 hash 签名原文，例如 SHA256(原文)。\n  前置密钥 = SHA256(key + 原文)。\n  追加密钥 = SHA256(原文 + key)。\n  前后都拼接 = SHA256(key + 原文 + key)。
form.sign.guide.variables=签名原文 = 最终拿去签名的字符串，不是 JSON 配置。\n\n常用变量：\n  ${method}              请求方法，例如 GET\n  ${path}                URL path，不含 query\n  ${query}               原始 query 字符串\n  ${body}                请求 body\n  ${header.Timestamp}    读取 Timestamp header\n  ${stablejson:payload}  GET 取 query，POST/PUT/PATCH 取 body，稳定 JSON 化\n  ${timestamp}           当前时间戳，由插件生成\n\n例子：\n  ${method}${path}${body}\n  ${header.Timestamp}${body}\n  SECRET${header.X-Request-Id}${stablejson:payload}
form.sign.guide.headers=签名前 Header = 签名前先写入/覆盖的请求 header，格式必须是 JSON 对象。\n\n例子：\n  {"Timestamp":"${timestamp}","X-Example-Header":"30"}\n\n执行顺序：\n  1. 根据 Header Templates 生成/覆盖 header\n  2. Custom Template 再读取这些 header，例如 ${header.Timestamp}\n  3. 计算签名\n  4. 把签名写到基础页配置的目标 header，例如 Sign\n\n什么时候不要写 Timestamp：\n  如果你在 Repeater 里想保留原请求 Timestamp 复放，就不要在这里生成 Timestamp。
form.sign.guide.canon=参数整理 = 把参数按固定规则排序/拼接，常见输出是 a=1&b=2。\n“参数之间用”通常是 &。\n“键和值之间用”通常是 =。\n\nstablejson:payload = 稳定 JSON 字符串：\n  - key 按字母排序\n  - number/boolean 转字符串\n  - 删除 null/undefined/NaN/空对象\n  - GET 用 query 参数，POST/PUT/PATCH 用 body\n\n如果协议明确要求 JSON 形态，例如 {"a":"1","b":"2"}，通常用 ${stablejson:payload}。\n如果协议要求 a=1&b=2，才考虑 Canonicalization 的排序/拼接选项。
form.sign.guide.payload=GET 与 POST 的 payload 来源不同：\n\n${stablejson:payload}\n  GET             -> 读取 URL query 参数\n  POST/PUT/PATCH  -> 读取请求 body JSON\n\n例子：\n  GET /api?a=1&category=20\n  ${stablejson:payload} = {"a":"1","category":"20"}\n\n  POST body {"resourceType":11,"locations":[0]}\n  ${stablejson:payload} = {"locations":["0"],"resourceType":"11"}\n\n测试建议：\n  在测试台直接粘 Burp 原始请求，输出会显示签名前原文和最终请求。
form.sign.guide.formula=把签名公式翻译成配置，可以按这个顺序看：\n\n  1. 哈希/签名算法是什么？\n     SHA256(...) -> 算法=SHA-256\n     HMAC-SHA256(...) -> 算法=HmacSHA256\n\n  2. secret/key 是单独作为 key，还是拼进原文？\n     HMAC(key, data) -> 密钥来源=固定值，密钥值填 key\n     SHA256(secret + data) -> 密钥来源=不需要密钥，把 secret 写进签名原文\n\n  3. 输出格式是什么？\n     64 位十六进制大写 -> 输出格式=hex，Hex 大小写=upper\n     Base64 -> 输出格式=base64\n\n  4. 签名前要不要生成 header？\n     需要动态时间戳 -> 签名前 Header 写 {"Timestamp":"${timestamp}"}\n     要复放原包 -> 不要覆盖这个 header\n\n  5. 签名写到哪里？\n     到基础页配置：目标类型=header，目标名称=Sign 或 X-Signature。
form.sign.guide.applied.hmac=通用 HMAC Header 签名已套用：HmacSHA256 + static key + hex lower。\n在密钥值里填服务端约定的 secret/key。\n基础页请确认目标类型=header，目标名称填写服务端要求的签名 header，例如 X-Signature。\n如果服务端要求 query 也参与签名，把模板改成 ${method}\\n${path}?${query}\\n${header.Timestamp}\\n${body}。
form.sign.guide.applied.hash=通用纯 Hash 模板签名已套用：SHA-256(template) + hex upper。\n把模板里的 SECRET 改成协议常量，或删除它改成你自己的拼接顺序。\nKey Source=none 表示密钥不额外拼接；所有参与签名的内容都应写进自定义模板。\nGET 的 ${stablejson:payload} 来自 query，POST/PUT/PATCH 来自 body JSON。
form.error.header_template=签名前 Header 模板必须是 JSON 对象，例如：\n{"Timestamp":"${timestamp}","X-Example-Header":"30"}
