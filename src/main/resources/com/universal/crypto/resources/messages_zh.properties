script.help.field.intro=字段处理说明:\n
script.help.field.1=1. Replace/Add 会把下面的内容写入目标字段，Remove 不需要填写内容。\n
script.help.field.2=2. 内容支持变量: ${method}, ${path}, ${body}, ${header.Name}, ${json:data.id}。\n
script.help.field.3=3. 常用动态值: ${timestamp}, ${timestamp:ms}, ${uuid}, ${random:alnum:12}。
script.help.field.group=字段写入
