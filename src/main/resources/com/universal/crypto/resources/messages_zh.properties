# Shared script and field guidance
script.help.tips=Script 是最后兜底能力：优先使用内置加密、签名、字段处理；只有协议很特殊时再写脚本。\n脚本应显式 return 字符串；返回 null / undefined 时保留原输入。返回值会按“基础”页的目标写回 body、header、field 或 variable。\n运行环境是 Rhino JavaScript，最长运行 5 秒；没有浏览器 DOM，禁止 Packages / Java 访问。二进制操作使用 Bytes，PBKDF2 / AES-GCM 使用 Crypto。
script.help.reference=输入与输出：\n  content                         当前动作读到的字符串\n  return "new value";             返回值会写回基础页选择的目标\n\n请求上下文：\n  request.getMethod()             GET / POST / ...\n  request.getUrl()                完整 URL\n  request.getHost()               Host\n  request.getPath()               URL path，不含 query\n  request.getQuery()              原始 query 字符串\n  request.getQueryParam("name")   读取指定 query 参数\n  request.getHeader("Name")       读取当前方向头部\n  request.getHeaders()            读取当前方向所有头部\n\n跨步骤变量：\n  ctx.isRequest()                 当前是否请求\n  ctx.getSharedData("name")       读取前面步骤保存的值\n  ctx.setSharedData("name", val)  保存给后续步骤\n\n内置工具：\n  Base64.encode(str), Base64.decode(str)\n  Hex.encode(str), Hex.decode(str)\n  Hash.md5(str), Hash.sha1(str), Hash.sha256(str)\n  Hash.hmacSha1(data, key), Hash.hmacSha256(data, key), Hash.hmacSha512(data, key)\n  Hash.hmacSha256Base64(data, key)\n\n注意：\n  写 Header 时，基础页选择“结果写回到=header”，目标名称填 Header 名，脚本 return 签名值。\n  修改 body/field 时，脚本 return 修改后的内容。\n原请求头：request.getOriginalHeader("Name") / request.getOriginalHeaders()；请求、响应两个方向均可读取原请求头快照。
script.help.runtime=支持的语言：\n  Rhino JavaScript。可以使用常见 JavaScript 语法、JSON、Date、Math、RegExp、Array、String。\n  不支持浏览器环境：没有 window、document、DOM、fetch。\n  不支持 Node.js：没有 require、import、npm 包、fs、Buffer。\n\n当前稳定支持的内置库：\n  Base64.encode/decode\n  Hex.encode/decode\n  Hash.md5/sha1/sha256\n  Hash.hmacSha1/hmacSha256/hmacSha512\n  Hash.hmacSha256Base64\n  request / ctx 上下文对象\n\n自定义库：\n  目前 UI 不支持上传 npm 包、jar 包或脚本库。\n  如果逻辑很复杂，建议优先做成“外部 API 服务处理”，插件通过外部服务调用。\n  禁止 Packages / Java 访问；二进制处理使用 Bytes，PBKDF2 / AES-GCM 使用 Crypto。
script.help.http=HTTP 信息怎么拿：\n\n  var method = request.getMethod();          // GET / POST\n  var url    = request.getUrl();             // 完整 URL\n  var host   = request.getHost();            // api.example.com\n  var path   = request.getPath();            // /api/order\n  var query  = request.getQuery();           // a=1&b=2\n  var a      = request.getQueryParam('a');   // 1\n  var ts     = request.getHeader('Timestamp');\n\nBody 怎么拿：\n  content 就是当前动作的输入。\n  如果基础页“输入源”保持默认，通常就是当前写回目标对应的内容。\n  处理请求 body 时，content 就是 body 字符串。
script.help.json=处理 JSON body：\n\n  var obj = JSON.parse(content || '{}');\n  obj.userId = '10001';\n  obj.debug = false;\n  return JSON.stringify(obj);\n\n只处理某个 JSON 字段：\n  脚本自行 JSON.parse、修改字段，再 return 完整 JSON 正文。\n  targetType=field 不会替脚本定位或提取字段。\n\n处理非 JSON：\n  直接把 content 当字符串处理，例如 Base64.decode(content)。
script.help.write=return 写回哪里，由“基础”页决定：\n\n  写回 body：\n    结果写回到 = body\n    脚本 return 完整的新 body\n\n  写回 Header：\n    结果写回到 = header\n    目标名称 = X-Signature\n    脚本 return 签名值\n\n  写回 JSON 字段：\n    脚本自行解析并修改 JSON，return 完整正文。\n    targetType=field 不会自动提取字段值。\n\n  写到变量给后续步骤：\n    结果写回到 = variable\n    目标名称 = myValue\n    后续步骤用 inputSource=variable 读取。
script.help.signature=自定义签名例子：\n\n目标：Sign = SHA256(method + path + query + Timestamp + body)\n\n基础页：\n  要做什么 = sign\n  结果写回到 = header\n  目标名称 = Sign\n  处理器 = script\n  执行时机 = 请求发送前 / 编辑器发送时\n\n脚本：\n  var raw = request.getMethod()\n          + request.getPath()\n          + request.getQuery()\n          + request.getHeader('Timestamp')\n          + content;\n  return Hash.sha256(raw).toUpperCase();
script.help.chain=链式处理例子：\n\n步骤 1：从 body 里取 token，保存给后续步骤\n  var obj = JSON.parse(content || '{}');\n  ctx.setSharedData('token', obj.token || '');\n  return content;\n\n步骤 2：用前面保存的 token 参与签名\n  var token = String(ctx.getSharedData('token') || '');\n  return Hash.sha256(token + content);\n\n如果只是临时传值，也可以把步骤 1 的结果写到 variable。
script.help.errors=常见错误：\n\n  1. 忘记 return\n     应 return 字符串或字节数组；null / undefined 保留原输入，空字符串会清空。\n\n  2. 基础页目标选错\n     想写 Header，就选 header 并填写目标名称；脚本只 return 值。\n\n  3. 把 query 当 body\n     query 用 request.getQuery() 或 getQueryParam(name)，body 用 content。\n\n  4. JSON.parse 报错\n     先确认 content 真的是 JSON；可以用 content || '{}' 做兜底。\n\n  5. 脚本超过 5 秒\n     避免死循环和大数据量复杂处理。
script.help.first=语言：Rhino JavaScript；没有 window、document、fetch、require、npm。\n\n写脚本前先确认三件事：\n\n  1. 从哪里读？\n     当前正文输入：用 content\n     header：用 request.getHeader('Header-Name')\n     query：用 request.getQueryParam('name')\n     path/method：用 request.getPath() / request.getMethod()\n\n  2. 怎么处理？\n     JSON.parse / JSON.stringify\n     Base64.decode / Base64.encode\n     Hex.decode / Hex.encode\n     Hash.md5 / Hash.sha1 / Hash.sha256\n\n  3. 写回哪里？\n     由“基础”页决定。脚本只需要 return 最终字符串。\n     写 Header 时 return header 值；写 Body 时 return 完整 body；写 Field 时脚本仍须 return 完整正文。
