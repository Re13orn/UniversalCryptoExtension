playground.help.field=字段处理测试说明：\n1. 输入区填写 JSON body。\n2. JSON 字段使用 $.data.id 这种路径。\n3. replace/add/remove 的结果会在右侧输出完整处理后的 JSON。
playground.help.signature=签名测试说明：\n1. 输入区可直接粘 Burp 原始 HTTP 请求，测试台会解析 method/path/query/header/body。\n2. 选择 custom 时可用 ${method}、${path}、${query}、${body}、${header.Name}、${stablejson:payload}。\n3. 输出会显示签名前原文、模板变量、生成签名和最终请求。
playground.help.crypto=加解密测试说明：\n1. 输入区可以放原始 body 或完整 HTTP 请求；处理器读取解析后的正文，并保留请求上下文。\n2. “本地计算”直接在插件里执行算法；“调用外部服务”用于联调已有公司接口。\n3. Base64/Hex/URL/Hash 这类编码摘要通常选择“不需要密钥”。
playground.help.hint.signature_header=生成的签名会写入这个 Header。
playground.help.hint.headers=例如 {"Timestamp":"${timestamp}"}，会先写入 Header 再参与签名。
playground.help.hint.field=例如 $.data.id
script.help.empty.hint=脚本代码不能为空。可以先套用一个模板，再根据协议修改。
script.help.empty.title=脚本代码不能为空

