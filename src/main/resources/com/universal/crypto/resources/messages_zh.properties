wizard.summary.edit_plain=1. 请求页签解密展示。\n2. 仅编辑器提交时加密修改后的明文。\n3. HTTP 发送回调保留该密文，避免重复加密。
wizard.summary.decrypt_response=1. 只在查看响应时解密。\n2. 实时流量需打开明文预览。\n3. 本场景只读；需要修改时选择“明文编辑响应”。
wizard.summary.encrypt_request=1. 请求发送前自动加密当前内容。\n2. 适合你在 Burp 里维护明文，但服务端只接受密文的接口。
wizard.summary.repeater_resign=1. 只处理 Repeater 里的请求。\n2. 每次发送前按最新请求内容重新计算签名。\n3. 签名会写入你指定的 Header。
wizard.summary.sign_header=1. 请求发送前计算签名。\n2. 签名写入指定 Header。\n3. 适合 X-Signature、Sign、Authorization 等签名头。
wizard.summary.sign_body=1. 先移除旧签名字段，避免签名包含自身。\n2. 对剩余 JSON 正文计算签名并写回顶层字段。\n3. 字段名称和签名原文须按实际协议核对。
wizard.summary.sign_query=1. 请求发送前整理 query 参数。\n2. 对整理后的参数计算签名，并写入指定 Header。
wizard.summary.replace_field=1. 请求发送前更新指定 JSON 字段。\n2. 适合自动替换 userId、timestamp、nonce 等字段。
wizard.validation.key_required=该场景需要填写密钥或 Secret。
