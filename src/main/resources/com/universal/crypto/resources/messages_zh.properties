form.sign.protocol_label=协议方案:
form.sign.guide.protocol=通常在“基础”页这样配：要做什么=sign，结果写回到=header，写回名称=Sign。\n如果签名公式把 secret 直接拼进原文，密钥来源选“不需要密钥”。\nGET 请求的“稳定 JSON 参数”来自 query；POST/PUT/PATCH 来自 body。\n如果想保留 Repeater 原请求里的 Timestamp，就不要在这里重新生成 Timestamp。
form.sign.examples=案例与说明
